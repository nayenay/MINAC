<svg width="900" height="460" viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="900" height="460" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Flujo de datos - Software MINAC</text>

  <!-- ESP32 -->
  <rect x="40" y="180" width="140" height="80" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="110" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">ESP32</text>
  <text x="110" y="232" text-anchor="middle" font-size="10" fill="#92400e">Calcula ppm + estado</text>
  <text x="110" y="246" text-anchor="middle" font-size="10" fill="#92400e">JSON via HTTP POST</text>

  <line x1="180" y1="220" x2="260" y2="220" stroke="#555" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <!-- Controller -->
  <rect x="260" y="90" width="160" height="70" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="340" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a5f">MonitoreoController</text>
  <text x="340" y="135" text-anchor="middle" font-size="10" fill="#1e3a5f">POST /monitoreo</text>
  <text x="340" y="150" text-anchor="middle" font-size="10" fill="#1e3a5f">GET /monitoreo</text>

  <!-- DTO -->
  <rect x="260" y="185" width="160" height="70" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="340" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a5f">CreateMonitoreoDto</text>
  <text x="340" y="227" text-anchor="middle" font-size="9" fill="#1e3a5f">Valida tipos y rangos</text>
  <text x="340" y="240" text-anchor="middle" font-size="9" fill="#1e3a5f">(class-validator)</text>

  <!-- Service -->
  <rect x="260" y="280" width="160" height="70" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="340" y="305" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a5f">MonitoreoService</text>
  <text x="340" y="322" text-anchor="middle" font-size="9" fill="#1e3a5f">Dual write: set + push</text>

  <line x1="340" y1="160" x2="340" y2="185" stroke="#555" stroke-width="1.2" marker-end="url(#arrow3)"/>
  <line x1="340" y1="255" x2="340" y2="280" stroke="#555" stroke-width="1.2" marker-end="url(#arrow3)"/>
  <line x1="420" y1="220" x2="480" y2="220" stroke="#555" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <!-- Firebase -->
  <rect x="480" y="150" width="180" height="150" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="570" y="175" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">Firebase RTDB</text>

  <rect x="495" y="190" width="150" height="45" rx="6" fill="#fecaca" stroke="#dc2626" stroke-width="1"/>
  <text x="570" y="208" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f1d1d">monitoreo/{'{idEquipo}'}</text>
  <text x="570" y="222" text-anchor="middle" font-size="9" fill="#7f1d1d">.set() -&gt; último valor</text>

  <rect x="495" y="245" width="150" height="45" rx="6" fill="#fecaca" stroke="#dc2626" stroke-width="1"/>
  <text x="570" y="263" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f1d1d">historico/{'{idEquipo}'}</text>
  <text x="570" y="277" text-anchor="middle" font-size="9" fill="#7f1d1d">.push() -&gt; serie completa</text>

  <line x1="660" y1="220" x2="720" y2="220" stroke="#555" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <!-- Frontend -->
  <rect x="720" y="150" width="150" height="150" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="795" y="175" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">Frontend (Next.js)</text>
  <text x="795" y="200" text-anchor="middle" font-size="9" fill="#15803d">GET /monitoreo</text>
  <text x="795" y="215" text-anchor="middle" font-size="9" fill="#15803d">-&gt; Dashboard general</text>
  <text x="795" y="235" text-anchor="middle" font-size="9" fill="#15803d">GET /monitoreo/historico/:id</text>
  <text x="795" y="250" text-anchor="middle" font-size="9" fill="#15803d">-&gt; Gráficas por nodo</text>
  <text x="795" y="270" text-anchor="middle" font-size="9" fill="#15803d">Polling o WebSocket</text>
  <text x="795" y="284" text-anchor="middle" font-size="9" fill="#15803d">(a definir por el equipo)</text>

  <!-- leyenda inferior -->
  <rect x="40" y="360" width="810" height="80" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="60" y="382" font-size="11" font-weight="bold" fill="#334155">Qué se guarda:</text>
  <text x="60" y="400" font-size="10" fill="#334155">idEquipo, mq2, mq3, mq135, mq9 (ppm), timestamp, via (directo/retransmitido), fueraDeRango, retransmitidoPor</text>
  <text x="60" y="418" font-size="10" fill="#334155">"monitoreo" = último valor por equipo (dashboard en vivo) | "historico" = serie completa con timestamp (para la capa predictiva)</text>

  <text x="450" y="453" text-anchor="middle" font-size="10" fill="#666">MINAC - Documentación de software</text>
</svg>
