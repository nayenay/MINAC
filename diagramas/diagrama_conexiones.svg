<svg width="900" height="620" viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="900" height="620" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Diagrama de conexiones - Nodo MINAC (ESP32 WROOM)</text>

  <!-- ESP32 -->
  <rect x="370" y="260" width="160" height="100" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="450" y="300" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">ESP32</text>
  <text x="450" y="320" text-anchor="middle" font-size="11" fill="#1e3a5f">WROOM (sin PSRAM)</text>
  <text x="450" y="336" text-anchor="middle" font-size="10" fill="#1e3a5f">I2C: GPIO21/22</text>
  <text x="450" y="350" text-anchor="middle" font-size="10" fill="#1e3a5f">SPI: GPIO4/5/18/19/23</text>

  <!-- ADS1115 -->
  <rect x="120" y="260" width="160" height="80" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="200" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#0d9488">ADS1115</text>
  <text x="200" y="310" text-anchor="middle" font-size="10" fill="#134e4a">I2C, dirección 0x48</text>
  <text x="200" y="325" text-anchor="middle" font-size="10" fill="#134e4a">4 canales A0-A3</text>
  <line x1="370" y1="300" x2="280" y2="300" stroke="#0d9488" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="325" y="292" text-anchor="middle" font-size="9" fill="#0d9488">SDA/SCL</text>

  <!-- Sensores MQ -->
  <rect x="20" y="60" width="130" height="60" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="85" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">MQ-2 (CH4)</text>
  <text x="85" y="102" text-anchor="middle" font-size="10" fill="#92400e">A0</text>

  <rect x="170" y="60" width="130" height="60" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="235" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">MQ-3 (Alcohol)</text>
  <text x="235" y="102" text-anchor="middle" font-size="10" fill="#92400e">A1</text>

  <rect x="320" y="60" width="130" height="60" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="385" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">MQ-135 (CO2 aprox.)</text>
  <text x="385" y="102" text-anchor="middle" font-size="10" fill="#92400e">A2</text>

  <rect x="470" y="60" width="130" height="60" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="535" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">MQ-9 (CO)</text>
  <text x="535" y="102" text-anchor="middle" font-size="10" fill="#92400e">A3</text>

  <text x="360" y="150" text-anchor="middle" font-size="10" fill="#92400e" font-style="italic">Cada sensor: AOUT --[divisor 10k/20k]--&gt; canal ADS1115</text>

  <line x1="85" y1="120" x2="180" y2="260" stroke="#d97706" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="235" y1="120" x2="200" y2="260" stroke="#d97706" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="385" y1="120" x2="220" y2="260" stroke="#d97706" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="535" y1="120" x2="240" y2="260" stroke="#d97706" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- NRF24L01 -->
  <rect x="620" y="260" width="180" height="90" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="710" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#5b21b6">NRF24L01+PA+LNA</text>
  <text x="710" y="310" text-anchor="middle" font-size="10" fill="#4c1d95">CE=4, CSN=5</text>
  <text x="710" y="325" text-anchor="middle" font-size="10" fill="#4c1d95">SCK=18, MOSI=23, MISO=19</text>
  <text x="710" y="340" text-anchor="middle" font-size="10" fill="#4c1d95">Alimentación 3.3V dedicada</text>
  <line x1="530" y1="300" x2="620" y2="300" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="575" y="292" text-anchor="middle" font-size="9" fill="#7c3aed">SPI</text>

  <!-- Semáforo -->
  <rect x="370" y="450" width="160" height="110" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="450" y="472" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">Semáforo (3 LEDs)</text>
  <circle cx="410" cy="500" r="10" fill="#22c55e"/>
  <text x="410" y="524" text-anchor="middle" font-size="9" fill="#15803d">GPIO15</text>
  <circle cx="450" cy="500" r="10" fill="#eab308"/>
  <text x="450" y="524" text-anchor="middle" font-size="9" fill="#854d0e">GPIO16</text>
  <circle cx="490" cy="500" r="10" fill="#ef4444"/>
  <text x="490" y="524" text-anchor="middle" font-size="9" fill="#991b1b">GPIO17</text>
  <text x="450" y="545" text-anchor="middle" font-size="9" fill="#166534">Resistencia ~220-330Ω por LED</text>
  <line x1="450" y1="360" x2="450" y2="450" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Alimentación -->
  <rect x="620" y="450" width="180" height="110" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="710" y="472" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">Rieles de alimentación</text>
  <text x="710" y="495" text-anchor="middle" font-size="10" fill="#7f1d1d">5V dedicado -&gt; sensores MQ</text>
  <text x="710" y="512" text-anchor="middle" font-size="10" fill="#7f1d1d">3.3V dedicado -&gt; ADS1115/RF</text>
  <text x="710" y="529" text-anchor="middle" font-size="10" fill="#7f1d1d">GND común entre todo</text>
  <text x="710" y="546" text-anchor="middle" font-size="9" font-style="italic" fill="#991b1b">Nunca compartir riel 5V con 3.3V</text>

  <text x="450" y="600" text-anchor="middle" font-size="10" fill="#666">MINAC - Documentación de hardware</text>
</svg>
