<svg width="900" height="500" viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="900" height="500" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Arquitectura de red - MINAC</text>
  <text x="450" y="50" text-anchor="middle" font-size="11" fill="#666">Nodos en la mina -&gt; Backend -&gt; Firebase -&gt; Dashboard</text>

  <!-- Zona mina -->
  <rect x="40" y="90" width="360" height="220" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="220" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">Interior de la mina</text>

  <!-- Nodo 1 -->
  <rect x="60" y="140" width="150" height="90" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="135" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">Nodo 1</text>
  <text x="135" y="182" text-anchor="middle" font-size="10" fill="#92400e">Sin conexión garantizada</text>
  <text x="135" y="197" text-anchor="middle" font-size="10" fill="#92400e">4 sensores + RF</text>
  <text x="135" y="212" text-anchor="middle" font-size="9" fill="#92400e" font-style="italic">Retransmite si no hay WiFi</text>

  <!-- Nodo 2 gateway -->
  <rect x="250" y="140" width="150" height="90" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="325" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a5f">Nodo 2 (Gateway)</text>
  <text x="325" y="182" text-anchor="middle" font-size="10" fill="#1e3a5f">4 sensores + RF + WiFi</text>
  <text x="325" y="197" text-anchor="middle" font-size="10" fill="#1e3a5f">Siempre con señal</text>
  <text x="325" y="212" text-anchor="middle" font-size="9" fill="#1e3a5f" font-style="italic">Retransmite lo del Nodo 1</text>

  <line x1="210" y1="185" x2="250" y2="185" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="230" y="178" text-anchor="middle" font-size="9" fill="#7c3aed">RF</text>

  <!-- Backend -->
  <rect x="480" y="140" width="150" height="90" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="555" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#5b21b6">Backend (NestJS)</text>
  <text x="555" y="182" text-anchor="middle" font-size="10" fill="#5b21b6">Railway</text>
  <text x="555" y="197" text-anchor="middle" font-size="10" fill="#5b21b6">POST /monitoreo</text>

  <line x1="400" y1="185" x2="480" y2="185" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="440" y="178" text-anchor="middle" font-size="9" fill="#1d4ed8">WiFi / HTTPS</text>

  <!-- Firebase -->
  <rect x="480" y="270" width="150" height="90" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="555" y="295" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">Firebase RTDB</text>
  <text x="555" y="312" text-anchor="middle" font-size="10" fill="#991b1b">monitoreo/{'{idEquipo}'}</text>
  <text x="555" y="327" text-anchor="middle" font-size="10" fill="#991b1b">historico/{'{idEquipo}'}</text>

  <line x1="555" y1="230" x2="555" y2="270" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- Frontend -->
  <rect x="700" y="205" width="150" height="90" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="775" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">Dashboard</text>
  <text x="775" y="247" text-anchor="middle" font-size="10" fill="#15803d">Next.js + Plotly.js</text>
  <text x="775" y="262" text-anchor="middle" font-size="10" fill="#15803d">Tiempo real</text>

  <line x1="630" y1="220" x2="700" y2="250" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="670" y="215" text-anchor="middle" font-size="9" fill="#dc2626">fetch/listener</text>

  <!-- Nota -->
  <rect x="40" y="400" width="810" height="70" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="60" y="422" font-size="11" fill="#334155" font-weight="bold">Principio de diseño:</text>
  <text x="60" y="440" font-size="10" fill="#334155">Solo el nodo Gateway necesita WiFi. Los demás nodos de la mina solo necesitan hablar por radio con</text>
  <text x="60" y="455" font-size="10" fill="#334155">algún nodo que sí tenga señal - así el sistema tolera zonas sin cobertura, que son la mayoría en una mina real.</text>

  <text x="450" y="490" text-anchor="middle" font-size="10" fill="#666">MINAC - Documentación de hardware</text>
</svg>
